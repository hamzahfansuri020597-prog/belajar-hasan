<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Belajar Yuk!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,sans-serif;background:#fff7e0;text-align:center;min-height:100vh;overflow-x:hidden}
h1{font-size:2rem;margin:20px 0 10px;color:#ff7043}
.hidden{display:none}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:500px;margin:auto}
.menu button{font-size:1.6rem;padding:30px 10px;border:none;border-radius:24px;color:#fff;font-weight:bold;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.menu button span{display:block;font-size:3.5rem}
.tes{font-size:1.3rem;border:none;background:#fff;border-radius:16px;padding:12px 24px;box-shadow:0 3px 0 rgba(0,0,0,.15);margin:6px}
#info{font-size:.9rem;color:#795548;margin:8px 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.top button{font-size:1.5rem;border:none;background:#fff;border-radius:16px;padding:8px 16px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#stars{font-size:1.6rem}
#stage{font-size:3rem;min-height:110px;padding:8px;line-height:1.2}
#q{font-size:1.6rem;font-weight:bold;color:#5d4037;margin:6px 12px}
.choices{display:flex;justify-content:center;gap:14px;padding:16px;flex-wrap:wrap}
.choice{width:28vw;max-width:150px;height:28vw;max-height:150px;background:#fff;border:none;border-radius:28px;font-size:4.5rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.dot{width:70%;height:70%;border-radius:50%}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25)}}
.fall{position:fixed;top:-50px;font-size:2.5rem;animation:fall 1.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>

<div id="menu">
  <h1>Belajar Yuk! 🌈</h1>
  <div class="menu">
    <button style="background:#e53935" onclick="start('warna')"><span>🎨</span>Warna</button>
    <button style="background:#43a047" onclick="start('hewan')"><span>🐶</span>Hewan</button>
    <button style="background:#1e88e5" onclick="start('bentuk')"><span>🔷</span>Bentuk</button>
    <button style="background:#fb8c00" onclick="start('angka')"><span>🔢</span>Hitung</button>
  </div>
  <button class="tes" onclick="tesSuara()">🔊 Tes Suara</button>
  <div id="info"></div>
</div>

<div id="game" class="hidden">
  <div class="top">
    <button onclick="home()">🏠</button>
    <div id="stars"></div>
    <button onclick="ulang()">🔊</button>
  </div>
  <div id="stage"></div>
  <div id="q"></div>
  <div class="choices" id="choices"></div>
</div>

<script>
// ====== UBAH NAMA ANAK DI SINI ======
const NAMA = 'Hasan';
// ====================================

const dot = c => `<div class="dot" style="background:${c}"></div>`;
const DATA = {
  warna: [
    {name:'merah',  view:dot('#e53935')},
    {name:'biru',   view:dot('#1e88e5')},
    {name:'kuning', view:dot('#fdd835')},
    {name:'hijau',  view:dot('#43a047')},
    {name:'oranye', view:dot('#fb8c00')},
    {name:'ungu',   view:dot('#8e24aa')},
    {name:'pink',   view:dot('#ec407a')}
  ],
  hewan: [
    {name:'anjing',  file:'anjing',  view:'🐶', bunyi:'guk guk guk'},
    {name:'kucing',  file:'kucing',  view:'🐱', bunyi:'meong meong'},
    {name:'sapi',    file:'sapi',    view:'🐮', bunyi:'mooo mooo'},
    {name:'ayam',    file:'ayam',    view:'🐔', bunyi:'kukuruyuk'},
    {name:'bebek',   file:'bebek',   view:'🦆', bunyi:'kwek kwek'},
    {name:'kambing', file:'kambing', view:'🐐', bunyi:'mbeek mbeek'},
    {name:'domba',   file:'domba',   view:'🐑', bunyi:'mbeeek mbeeek'},
    {name:'kuda',    file:'kuda',    view:'🐴', bunyi:'ihihihi'},
    {name:'babi',    file:'babi',    view:'🐷', bunyi:'oink oink'},
    {name:'singa',   file:'singa',   view:'🦁', bunyi:'groaarr'},
    {name:'harimau', file:'harimau', view:'🐯', bunyi:'grrrr aumm'},
    {name:'gajah',   file:'gajah',   view:'🐘', bunyi:'tuuut tuuut'},
    {name:'monyet',  file:'monyet',  view:'🐵', bunyi:'uu aa uu aa'},
    {name:'burung',  file:'burung',  view:'🐦', bunyi:'cit cit cuit'},
    {name:'katak',   file:'katak',   view:'🐸', bunyi:'kongkong'},
    {name:'ular',    file:'ular',    view:'🐍', bunyi:'sssss'},
    {name:'lebah',   file:'lebah',   view:'🐝', bunyi:'zzzzz'},
    {name:'ikan',    file:'ikan',    view:'🐟', bunyi:'blub blub'}
  ],
  bentuk: [
    {name:'lingkaran', view:'⭕'},{name:'persegi',   view:'🟦'},
    {name:'segitiga',  view:'🔺'},{name:'bintang',   view:'⭐'},
    {name:'hati',      view:'❤️'}
  ],
  angka: [1,2,3,4,5].map(n => ({name:String(n), view:String(n)}))
};

let mode, target, score = 0, locked = false, tanyaSuara = false;

const $ = id => document.getElementById(id);
const shuffle = a => [...a].sort(() => Math.random() - .5);
const acak = a => a[Math.floor(Math.random()*a.length)];

// ================= SUARA UCAPAN =================
let suaraPilihan = null;
function pilihSuara(){
  try{
    const v = speechSynthesis.getVoices();
    if(!v.length) return;
    suaraPilihan = v.find(x => /^id/i.test(x.lang) || /indones/i.test(x.name)) || null;
    $('info').textContent = suaraPilihan
      ? ''
      : 'Catatan: suara bahasa Indonesia belum terpasang di perangkat ini, jadi ucapan memakai suara lain.';
  }catch(e){}
}
try{
  pilihSuara();
  speechSynthesis.onvoiceschanged = pilihSuara;
}catch(e){}

function say(t, onend){
  let selesai = false;
  const fin = () => { if(!selesai){ selesai = true; if(onend) onend(); } };
  try{
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'id-ID'; u.rate = .85; u.pitch = 1.2; u.volume = 1;
    if(suaraPilihan) u.voice = suaraPilihan;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 6000 + t.length*150); // cadangan
  }catch(e){ fin(); }
}
function speak(t){ try{ speechSynthesis.cancel(); }catch(e){} say(t); }

// ================= NADA & SUARA BUATAN =================
let ac;
function getAC(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
// not: [tipe, freqAwal, freqAkhir, mulai(detik), durasi(detik), volume]
function mainkan(notes){
  try{
    const a = getAC();
    let total = 0;
    notes.forEach(([tipe,f0,f1,t,d,v]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = tipe;
      const t0 = a.currentTime + t;
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.linearRampToValueAtTime(f1, t0 + d);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(v, t0 + Math.min(.05, d/3));
      g.gain.exponentialRampToValueAtTime(.001, t0 + d);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + d + .02);
      total = Math.max(total, t + d);
    });
    return total;
  }catch(e){ return 0; }
}
const tingBenar = () => mainkan([['sine',660,660,0,.15,.3],['sine',880,880,.15,.15,.3],['sine',1100,1100,.3,.25,.3]]);
const tingSalah = () => mainkan([['triangle',220,200,0,.22,.3],['triangle',160,140,.22,.3,.3]]);

const SINTETIS = {
  anjing:  [['sawtooth',350,150,0,.18,.4],['sawtooth',350,150,.35,.18,.4],['sawtooth',350,150,.7,.18,.4]],
  kucing:  [['sine',500,900,0,.25,.4],['sine',900,600,.25,.5,.4],['triangle',1000,700,.25,.5,.15]],
  sapi:    [['sawtooth',130,90,0,1.4,.35],['sawtooth',65,45,0,1.4,.25]],
  ayam:    [['sawtooth',500,900,0,.3,.3],['sawtooth',900,1000,.3,.4,.3],['sawtooth',1000,450,.7,.6,.3]],
  bebek:   [['square',520,380,0,.15,.25],['square',520,380,.25,.15,.25],['square',520,380,.5,.15,.25]],
  kambing: [['sawtooth',480,430,0,.3,.3],['sawtooth',430,380,.35,.5,.3],['sawtooth',500,450,1,.3,.3],['sawtooth',450,390,1.35,.5,.3]],
  domba:   [['sawtooth',420,380,0,.35,.3],['sawtooth',380,330,.4,.6,.3],['sawtooth',440,400,1.15,.35,.3],['sawtooth',400,340,1.55,.6,.3]],
  kuda:    [['sawtooth',700,1300,0,.3,.3],['sawtooth',1300,900,.3,.2,.3],['sawtooth',900,1250,.5,.2,.3],['sawtooth',1250,500,.7,.5,.3]],
  babi:    [['sawtooth',220,160,0,.2,.35],['sawtooth',200,150,.3,.2,.35],['sawtooth',220,160,.6,.2,.35]],
  singa:   [['sawtooth',200,300,0,.4,.35],['sawtooth',300,90,.4,1.2,.4],['sawtooth',150,60,.4,1.2,.3]],
  harimau: [['sawtooth',180,260,0,.3,.35],['sawtooth',260,80,.3,1,.4],['sawtooth',130,55,.3,1,.3]],
  gajah:   [['sawtooth',250,800,0,.6,.35],['sawtooth',800,900,.6,.4,.35],['sawtooth',900,300,1,.5,.35]],
  monyet:  [['square',600,900,0,.12,.25],['square',900,600,.15,.12,.25],['square',600,900,.3,.12,.25],['square',900,600,.45,.12,.25],['square',650,950,.65,.12,.25],['square',950,650,.8,.12,.25]],
  burung:  [['sine',1800,2600,0,.1,.3],['sine',2600,1900,.12,.1,.3],['sine',1800,2600,.3,.1,.3],['sine',2600,1900,.42,.1,.3],['sine',2000,2800,.6,.15,.3]],
  katak:   [['square',130,110,0,.12,.3],['square',130,110,.18,.12,.3],['square',130,110,.36,.12,.3],['square',130,110,.54,.12,.3],['square',130,110,.72,.12,.3]],
  ular:    [['sawtooth',3800,3400,0,1.3,.12],['sawtooth',4200,3600,0,1.3,.1]],
  lebah:   [['sawtooth',150,155,0,1.4,.25],['sawtooth',300,310,0,1.4,.12]],
  ikan:    [['sine',400,900,0,.12,.4],['sine',500,1000,.25,.12,.4],['sine',450,950,.5,.12,.4],['sine',600,1100,.75,.12,.4]]
};

// Putar suara hewan: pakai file rekaman kalau ada (mp3/wav/ogg/m4a), kalau tidak pakai suara buatan
function suaraHewan(h, done){
  let selesai = false;
  const fin = () => { if(!selesai){ selesai = true; done(); } };
  const cadangan = () => {
    if(selesai) return;
    const d = mainkan(SINTETIS[h.file] || []);
    setTimeout(fin, d*1000 + 300);
  };
  const exts = ['mp3','wav','ogg','m4a'];
  const coba = i => {
    if(selesai) return;
    if(i >= exts.length){ cadangan(); return; }
    let lanjut = false, mulai = false;
    const berikut = () => { if(!lanjut && !mulai){ lanjut = true; coba(i+1); } };
    const a = new Audio('suara/' + h.file + '.' + exts[i]);
    a.onplaying = () => { mulai = true; };
    a.onended = fin;
    a.onerror = berikut;
    const p = a.play();
    if(p && p.catch) p.catch(berikut);
    setTimeout(() => { if(!mulai){ a.pause(); berikut(); } }, 5000);
  };
  coba(0);
  setTimeout(fin, 15000);
}

function start(m){
  try{ getAC(); }catch(e){}
  mode = m; score = 0; renderStars();
  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  next();
}
function home(){
  try{ speechSynthesis.cancel(); }catch(e){}
  $('game').classList.add('hidden');
  $('menu').classList.remove('hidden');
}
function renderStars(){ $('stars').textContent = '⭐'.repeat(Math.min(score,10)); }

function questionText(){
  if(mode==='angka') return 'Ada berapa apel?';
  if(mode==='warna') return `Mana yang warna ${target.name}?`;
  if(mode==='hewan'){
    return tanyaSuara ? `Siapa yang bersuara ${target.bunyi}?`
                      : `Mana gambar ${target.name}?`;
  }
  return `Mana yang ${target.name}?`;
}
function ulang(){
  speak(questionText());
}

function next(){
  locked = false;
  const opts = shuffle(DATA[mode]).slice(0,3);
  target = acak(opts);
  tanyaSuara = (mode==='hewan' && Math.random() < .5);
  $('stage').innerHTML = mode==='angka' ? '🍎'.repeat(+target.name)
                       : (tanyaSuara ? '🔊' : '');
  $('q').textContent = questionText();
  $('choices').innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = o.view;
    b.onclick = () => jawab(b, o);
    $('choices').appendChild(b);
  });
  setTimeout(ulang, 400);
}

function jawab(btn, o){
  if(locked) return;
  try{ getAC(); }catch(e){}

  if(o === target){
    locked = true; score++; renderStars();
    btn.classList.add('pop');
    confetti();
    try{ speechSynthesis.cancel(); }catch(e){}

    let lanjut = false;
    const go = () => { if(!lanjut){ lanjut = true; next(); } };
    setTimeout(go, 20000); // cadangan

    const ucapan = () => {
      say(`Alhamdulillah, ${NAMA} betul!`);
      say(`Ayo lanjutkan ${NAMA}!`, go);
    };

    if(mode === 'hewan'){
      // 1) suara hewan  2) "Alhamdulillah Hasan betul"
      suaraHewan(o, () => setTimeout(ucapan, 300));
    } else {
      tingBenar();
      setTimeout(ucapan, 700);
    }
  } else {
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    tingSalah();
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(() => say(`${NAMA} salah. Coba lagi ya ${NAMA}`), 450);
  }
}

function confetti(){
  const e = ['⭐','🎉','🎈','✨','💖'];
  for(let i=0;i<14;i++){
    const s = document.createElement('div');
    s.className = 'fall';
    s.textContent = acak(e);
    s.style.left = Math.random()*95 + 'vw';
    s.style.animationDelay = Math.random()*.4 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2200);
  }
}
</script>
</body>
</html>
